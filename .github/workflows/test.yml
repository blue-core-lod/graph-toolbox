name: Test
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # Only the plugin package and its tests: the legacy PyScript modules in
      # src/*.py predate ruff here and are retired as screens move over (#48).
      - name: Format
        run: uv run ruff format --diff src/bluecore_graph_toolbox tests

      - name: Lint
        run: uv run ruff check src/bluecore_graph_toolbox tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        # Both ends of the apache-airflow>=3.2.0,<4 range.
        airflow-version: ["3.2.*", "3.3.2"]
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --with "apache-airflow==${{ matrix.airflow-version }}" pytest
[project]
name = "blue-core-graph-toolbox"
version = "2.0.0"
description = "Airflow Plugin for Blue Core Toolbox"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "apache-airflow>=3.2.0,<4",
    "bluecore-airflow-common>=0.1.0",
    "jinja2>=3.1.6",
]

[project.entry-points."airflow.plugins"]
bluecore_graph_toolbox = "bluecore_graph_toolbox.plugin:GraphToolboxPlugin"

[dependency-groups]
dev = [
    "apache-airflow==3.3.2",
    "httpx",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bluecore_graph_toolbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]

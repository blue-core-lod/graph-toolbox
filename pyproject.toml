[project]
name = "bluecore-graph-toolbox"
version = "2.0.0"
description = "Airflow Plugin for Blue Core Toolbox"
readme = "README.md"
requires-python = "==3.12.*"
license = "Apache-2.0"
license-files = ["LICENSE-2.0.txt"]
keywords = ["airflow", "airflow-plugin", "bibframe", "blue-core", "rdf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Apache Airflow",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "apache-airflow>=3.2.0,<4",
    "bluecore-airflow-common>=0.1.0",
    "jinja2>=3.1.6",
]

[project.urls]
Homepage = "https://github.com/blue-core-lod/graph-toolbox"
Issues = "https://github.com/blue-core-lod/graph-toolbox/issues"

[project.entry-points."airflow.plugins"]
bluecore_graph_toolbox = "bluecore_graph_toolbox.plugin:GraphToolboxPlugin"

[dependency-groups]
dev = [
    "apache-airflow==3.3.2",
    "httpx",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bluecore_graph_toolbox"]

[tool.hatch.build.targets.sdist]
include = [
    "src/bluecore_graph_toolbox",
    "tests",
    "README.md",
    "LICENSE-2.0.txt",
]
[tool.pytest.ini_options]
testpaths = ["tests"]

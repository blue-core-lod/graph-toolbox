{% extends "bluecore/base.html" %}

{% block head %}
<link rel="stylesheet" href="{{ static_url('toolbox.css') }}" />
<link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
<script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
{% endblock %}

{% block body_class %}centered{% endblock %}

{% block content %}
<img
  class="toolbox-logo"
  src="{{ static_url('blue-core-v1.svg') }}"
  alt="Blue Core"
/>
<h1>{{ title }}</h1>
<p>Signed in as {{ username }}</p>
<p class="toolbox-version">Version {{ version }}</p>
{% endblock %}
